name: Publish GHCR image

on:
  workflow_dispatch:

permissions:
  contents: read

# Share the lock across dispatch refs so concurrent runs cannot race on latest.
concurrency:
  group: publish-ghcr-master
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out latest master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This repository uses master, not main. Ignore the dispatch ref.
          ref: refs/heads/master
          fetch-depth: 1
          persist-credentials: false

      - name: Derive image name and source revision
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ steps.image.outputs.revision }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "Source branch: master"
            echo "Source commit: $REVISION"
            echo "Image: $IMAGE:latest"
            echo "Commit tag: $IMAGE:sha-$REVISION"
            echo "Digest: $DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
